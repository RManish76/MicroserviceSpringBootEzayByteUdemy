services:
  
  ##################Start of Grafana dokcer-compose################
  read:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/config.yaml -target=read"  #will look fol lokiConfig file in container at this location
    ports:
      - 3101:3100
      - 7946
      - 9095
    volumes:
      - E:\01_SpringBootEzaybytesUdemy\section11\docker-compose\observability\loki\loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: &loki-dns  #  &-->knonw as ancheor --> creates a variable in yaml file and we are storing values below it in this vairable.
      eazybank: #updated the network name
        aliases:
          - loki #keeping the aliases as same as grafana might be using network aliase name as loki internally

  write:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/config.yaml -target=write" #will look fol lokiConfig file in container at this location
    ports:
      - 3102:3100
      - 7946
      - 9095
    volumes:
      - E:\01_SpringBootEzaybytesUdemy\section11\docker-compose\observability\loki\loki-config.yaml:/etc/loki/config.yaml  #updated the lokiconfig file location in local after: it where docker need to put the file in container
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - minio
    networks:
      <<: *loki-dns #no need to updated as its the reading the vairable value which created at read servicce

  alloy:
    image: grafana/alloy:latest
    volumes:
      - E:\01_SpringBootEzaybytesUdemy\section11\docker-compose\observability\alloy\alloy-local-config.yaml:/etc/alloy/config.alloy:ro #updated the alloyConfig location after: is loaction where it need to copy and paste the file in container and :ro --> means read only, so no updated shoule happen at the file at anytime
      - /var/run/docker.sock:/var/run/docker.sock
    command:  run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - 12345:12345
    depends_on:
      - gateway
    extends:  #updated the network info using our common config file
      file: common-config.yml
      service: network-deploy-service 

  minio:
    image: minio/minio
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - 9000
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    extends:  #updated the network info using our common config file
      file: common-config.yml
      service: network-deploy-service 

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - gateway
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://gateway:3100
            jsonData:
              httpHeaderName1: "X-Scope-OrgID"
            secureJsonData:
              httpHeaderValue1: "tenant1"
        EOF
        /run.sh
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extends:  #updated the network info using our common config file
      file: common-config.yml
      service: network-deploy-service 

  backend:
    image: grafana/loki:latest
    volumes:
      - E:\01_SpringBootEzaybytesUdemy\section11\docker-compose\observability\loki\loki-config.yaml:/etc/loki/config.yaml
    ports:
      - "3100"
      - "7946"
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"
    depends_on:
      - gateway
    extends:  #updated the network info using our common config file
      file: common-config.yml
      service: network-deploy-service 
    

  gateway:
    image: nginx:latest
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        user  nginx;
        worker_processes  5;  ## Default: 1

        events {
          worker_connections   1000;
        }

        http {
          resolver 127.0.0.11;

          server {
            listen             3100;

            location = / {
              return 200 'OK';
              auth_basic off;
            }

            location = /api/prom/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /api/prom/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /api/prom/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }

            location = /loki/api/v1/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /loki/api/v1/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /loki/api/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    extends:  #updated the network info using our common config file
      file: common-config.yml
      service: network-deploy-service 
  ##################End of Grafana docker-compose##################




  #commented redis which we used for ratelimiter, because we are going to use other container in future.
  #So to free the resouces
  # redis:
  #   image: redis
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
  #     timeout: 10s
