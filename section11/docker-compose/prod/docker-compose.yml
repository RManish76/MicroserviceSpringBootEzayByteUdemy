  configserver: #service name
    image: "pdcourse/configserver:s11" 
    container_name: configserver-ms  
    ports:
      - "8071:8071"
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  eurekaserver: #service name
    image: "pdcourse/eurekaserver:s11" 
    container_name: eurekaserver-ms  
    ports:
      - "8070:8070"
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"  #to overwrite the application name in application.yml (not mandatory as we have kept same name in applicaton.yml)
                                                #this name is used to fetch the config file from the configserver. giveing this name here anyone can know what is the application name in code. better visibility
  

  accounts:  #service name
    image: "pdcourse/accounts:s11" 
    container_name: accounts-ms  
    ports:
      - "8080:8080"
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 100s
      timeout: 10s
      retries: 10
      start_period: 100s
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "accounts"
    extends:
      file: common-config.yml
      service: microservice-eureka-config
  
  loans: #service name
    image: "pdcourse/loans:s11"
    container_name: loans-ms
    ports:
      - "8090:8090"
    healthcheck:
      test: "curl --fail --silent localhost:8090/actuator/health/readiness | grep UP || exit 1"
      interval: 100s
      timeout: 10s
      retries: 10
      start_period: 100s
    environment:
      SPRING_APPLICATION_NAME: "loans"
    extends:
      file: common-config.yml
      service: microservice-eureka-config
  
  cards: #service name
    image: "pdcourse/cards:s11"
    container_name: cards-ms
    ports:
      - "9000:9000"
    healthcheck:
      test: "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1"
      interval: 100s
      timeout: 10s
      retries: 10
      start_period: 100s
    environment:
      SPRING_APPLICATION_NAME: "cards"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  # cards1: #service name
  #   image: "pdcourse/cards:s9"
  #   container_name: cards1-ms
  #   ports:
  #     - "9001:9000"
  #   healthcheck:
  #     test: "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1"
  #     interval: 10s
