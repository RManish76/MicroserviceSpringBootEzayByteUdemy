# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

#this act as key and value and same will be accessed by the eazybank-common heml chart.

deploymentName: eurekaserver-deployment
serviceName: eurekaserver
appLabel: eurekaserver
appName: eurekaserver

replicaCount: 1

image:
  repository: pdcourse/eurekaserver #image name
  tag: s14 #image tag

containerPort: 8070 #container port

service:
  type: ClusterIP #as we don't want to expose the eurekaserver MS outside of kubernetes cluster hence we are using service type as clusterIP
  port: 8070 #
  targetPort: 8070

#required enviornment varaibles for eurekaserver MS. as we are checking if condition in eazybank-common before passing the environment variable to the MS.
appname_enabled: true
profile_enabled: false
config_enabled: true
eureka_enabled: false
resouceserver_enabled: false #keycloak related. as only gatewayserver need it. and all other MS does not need it.
otel_enabled: true
kafka_enabled: false