services:

  network-deploy-service:
    networks:
      - eazybank  #docker network need in all service including rabbitMQ

  microservice-base-config:
    extends:
      service: network-deploy-service
    deploy:
      resources:
        limits:
          memory: 500m
    environment:
      SPRING_RABBITMQ_HOST: "rabbit"

  microservice-configserver-config:
    extends:
      service: microservice-base-config
    environment:
      SPRING_PROFILES_ACTIVE: default #this does not required for rabbitmq hence created two seprate service
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
