services:
  rabbit:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "5672:5672" #for rabitmq core activities
      - "15672:15672" # managment of rabbitMq
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity # from rabitmq offical documentation
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      file: common-config.yml
      service: network-deploy-service
  
  configserver: #service name
    image: "pdcourse/configserver:s6" 
    container_name: configserver-ms  
    ports:
      - "8071:8071"
    depends_on:
      rabbit:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config
  
  accounts:  #service name
    image: "pdcourse/accounts:s6" 
    container_name: accounts-ms  
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        conditon: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "accounts"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
  
  loans: #service name
    image: "pdcourse/loans:s6"
    container_name: loans-ms
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        conditon: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "loans"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
  
  cards: #service name
    image: "pdcourse/cards:s6"
    container_name: cards-ms
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        conditon: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "cards"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

networks:  
  eazybank: 
    driver: "bridge"